name: Matte OS quality gates

on:
  pull_request:
  push:
    branches:
      - fix/saamiya-tal-book-first-20261028
      - feature/burgundy-posters-20261028
      - feature/grade8-navy-burgundy-posters-20261028
      - feature/plain-paper-math-lessons-audit-20261029
      - feature/matte-os-cup-20261030
      - feature/ux-calm-navigation-paper-20261030

jobs:
  unit-and-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/content9.js
          node --check js/core.js
          node --check js/teach-simple.js
          node tests/paper-lessons.js
          node --check js/engine.js
          node --check sw.js
          node --check prov/sw.js
          node --check js/cup.js
          node --check js/cup-api.js
          node --check js/qr.js
          node --check cup/dev/rest-shim.js
      - name: Poster syntax and content checks
        run: |
          node --check affischer/posters.js
          node --check tests/posters-e2e.js
          node tests/posters-content.js
          node tests/hint-mapping.js
      - name: Math and content verification
        run: node tests/qa.js
      - name: Figure, unit and geometry checks
        run: node tests/figure-consistency.js
      - name: Table arena and progress integration
        run: node tests/tabell-integration.js
      - name: Book-first regression
        run: node tests/book-first-regression.js

  browser-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for Chromium-based visual checks
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Mobile emulation end-to-end
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/matte-server.log 2>&1 &
          sleep 2
          node tests/book-first-e2e.js http://127.0.0.1:8765/ test-screenshots
          node tests/posters-e2e.js http://127.0.0.1:8765/ test-screenshots
          node tests/paper-lessons-e2e.js http://127.0.0.1:8765/ test-screenshots
          node tests/calm-ux-e2e.js http://127.0.0.1:8765/
      - name: Same-origin upgrade from production 5.5.0 with synthetic progress
        run: |
          git fetch --depth 1 origin 7f87feeac11fc4800b05cbee0cfded415b1052ff
          mkdir -p /tmp/matte-baseline-550
          git archive FETCH_HEAD | tar -x -C /tmp/matte-baseline-550
          node tests/upgrade-e2e.js /tmp/matte-baseline-550 .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matte-os-mobile-screenshots
          path: test-screenshots/
          if-no-files-found: ignore

  cross-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit and Firefox browser engines
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps webkit firefox
      - name: Cross-engine student-flow regression (simulated devices, synthetic data)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/matte-cross-engine.log 2>&1 &
          sleep 2
          node tests/cross-engine-e2e.js http://127.0.0.1:8765/

  cup-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cuptest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Load Cup schema into throwaway Postgres (Supabase roles emulated)
        run: |
          psql -d postgres -c "create database cuptest"
          psql -d cuptest -c "create role anon nologin; create role authenticated nologin;"
          psql -d cuptest -v ON_ERROR_STOP=1 -f cup/supabase/0001_matte_os_cup.sql
          psql -d cuptest -v ON_ERROR_STOP=1 -f cup/supabase/0004_cup_quickmatch.sql
      - name: QR decode, game flow with 10 players, security
        run: |
          node tests/cup-qr.js
          PORT=8787 node cup/dev/rest-shim.js &
          sleep 2
          node tests/cup-backend.js http://127.0.0.1:8787
          node tests/cup-security.js
          node tests/cup-hardening.js
          node tests/cup-seeding.js 300
          node tests/cup-api-headers.js
          node tests/cup-integrity-abuse.js
          node tests/cup-rollback.js
      - name: Quickmatch server regressions (2 players, custom tables and 3 rounds)
        run: node tests/cup-quick-backend.js http://127.0.0.1:8787
      - name: Browser E2E with 1 host + 10 players
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/matte-server.log 2>&1 &
          sleep 2
          node tests/cup-e2e.js http://127.0.0.1:8765/ http://127.0.0.1:8787 test-screenshots
          node tests/cup-quick-e2e.js http://127.0.0.1:8765/ http://127.0.0.1:8787
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matte-os-cup-screenshots
          path: test-screenshots/
          if-no-files-found: ignore

  cup-supabase-staging:
    # Only one real staging run per code update, against the dedicated NEW hdbahub project.
    # Creates disposable rooms with synthetic nicknames; never reads any old account.
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/matte-os-cup-20261030'
    needs: [cup-backend, unit-and-content]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Simulate 10 separate mobiles against REAL Supabase REST (staging only)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/matte-live-server.log 2>&1 &
          sleep 2
          node tests/cup-e2e.js http://127.0.0.1:8765/ https://bjyahpcpthumpbktrxnc.supabase.co staging-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cup-supabase-staging-screenshots
          path: staging-screenshots/
          if-no-files-found: ignore
