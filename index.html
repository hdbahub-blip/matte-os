/* =========================
   MATTE OS 2 — CALM VISUAL LEARNING
   ========================= */
:root{
  --focus-bg:#fffdf8;--focus-ink:#191513;--focus-soft:#f8efe6;--focus-line:#e5d8c8;
  --gold:#b88a3f;--gold-soft:#f3e7c9;--deep-shadow:0 22px 60px rgba(50,28,20,.10);
}
body{background:
 radial-gradient(circle at 10% 8%,rgba(111,22,48,.055),transparent 27rem),
 radial-gradient(circle at 90% 16%,rgba(184,138,63,.055),transparent 25rem),
 linear-gradient(180deg,#fbf8f2 0%,#f4ede3 100%)}
.topbar{background:rgba(253,249,242,.92);border-bottom:1px solid rgba(85,51,36,.08)}
.brand-mark{border-radius:14px;box-shadow:0 9px 24px rgba(76,25,39,.18)}
.profile-switch{border-color:#eadfd1;box-shadow:0 5px 18px rgba(55,31,24,.05)}

's9-scientific':{plain:'Grundpotensform är ett kompakt sätt att skriva väldigt stora eller små tal: ett tal mellan 1 och 10 gånger en tiopotens.',goal:'Gå åt båda håll mellan vanligt tal och a × 10ⁿ.',recognize:['Mycket stora eller mycket små tal.','Frågan säger grundpotensform eller tiopotens.','Du behöver jämföra storleksordningar.'],think:['Var ska decimaltecknet ligga för att första talet ska bli 1–9,999…?','Hur många steg flyttade jag?','Flytt åt vänster ger positiv exponent; åt höger negativ.'],reverse:['4,2 × 10⁵ → flytta decimalen 5 steg åt höger.','0,00042 → flytta decimalen 4 steg åt höger för att få 4,2, alltså 10⁻⁴.'],mistakes:['Första talet blir 42 i stället för 4,2.','Exponentens tecken blir fel för små tal.'],memory:'Exponent = antal decimalsteg.'},
's9-powers':{plain:'En potens är upprepad multiplikation. Reglerna fungerar bara när basen är samma.',goal:'Multiplicera och dividera potenser och förstå varför exponenterna ändras.',recognize:['Samma bas förekommer flera gånger.','Du ser upphöjda exponenter.','Frågan ber dig förenkla en potens.'],think:['Är basen verkligen samma?','Är operationen multiplikation eller division?','Ska exponenter adderas eller subtraheras?'],reverse:['Om aᵐ·aⁿ=a⁷ och m=3 kan du tänka bakåt: n=7−3.','Om resultatet har för stor exponent har du ofta multiplicerat exponenterna av misstag.'],mistakes:['Multiplicerar exponenterna i stället för att addera.','Använder potensregeln trots olika baser.'],memory:'Samma bas: × = plus i exponenten, ÷ = minus.'},
's9-sqrt':{plain:'Kvadratrot frågar: vilket positivt tal multiplicerat med sig självt ger talet under rottecknet?',goal:'Växla mellan kvadrat och kvadratrot och lösa baklänges.',recognize:['Du ser √.','En kvadrat eller area leder till en saknad sidlängd.','Du har x² och vill få x.'],think:['Vilket tal i kvadrat ger detta?','Är jag ute efter x eller x²?','Är svaret rimligt jämfört med närliggande kvadrattal?'],reverse:['x²=81 → x=√81=9 för en positiv längd.','√x=7 → kvadrera båda sidor: x=49.'],mistakes:['Svarar med talet under roten i stället för roten.','Glömmer att längd i geometri tas som positiv.'],memory:'Kvadrat och kvadratrot är motsatser.'},
's9-number-sets':{plain:'Talmängder är lådor inuti varandra: naturliga tal ligger i heltal, som ligger i rationella tal, som ligger i reella tal.',goal:'Placera ett tal i den minsta korrekta talmängden och förklara varför.',recognize:['Frågan nämner N, Z, Q eller R.','Du ska sortera heltal, bråk eller irrationella tal.'],think:['Är talet ett positivt heltal?','Är det ett heltal men kanske negativt?','Kan det skrivas som ett bråk av heltal?'],reverse:['Börja med den minsta lådan och gå utåt tills talet passar.'],mistakes:['Glömmer att ett heltal också är rationellt och reellt.','Tror att alla decimaltal är irrationella.'],memory:'N ⊂ Z ⊂ Q ⊂ R – små lådor i större.'},
's9-angles':{plain:'Vinkelproblem handlar om hur mycket en riktning vrids. Du behöver först känna igen vilken vinkelrelation bilden visar.',goal:'Välja rätt vinkelregel och räkna fram en okänd vinkel.',recognize:['Triangel → summan 180°.','Rak linje → 180°.','Helt varv → 360°.','Korsande linjer → vertikalvinklar är lika.'],think:['Vilken figur eller relation ser jag?','Vilka vinklar är redan kända?','Vilken summa måste de tillsammans bli?'],reverse:['Om två triangelvinklar är kända: okänd = 180° − kända.','Om en reflexvinkel saknas: okänd = 360° − känd.'],mistakes:['Använder 360° i en triangel.','Blandar sidovinkel och vertikalvinkel.'],memory:'Identifiera bilden först – välj regeln sedan.'},
's9-pythagoras':{plain:'Pythagoras kopplar ihop de tre sidorna i en rätvinklig triangel. Hypotenusan är alltid sidan mitt emot den räta vinkeln och är längst.',goal:'Lösa både framåt (hypotenusan) och bakåt (en katet) och känna igen dolda rätvinkliga trianglar.',recognize:['Det finns en rät vinkel.','En sida i en rätvinklig triangel saknas.','En diagonal i en rektangel eller kvadrat skapar en rätvinklig triangel.'],think:['Var är den räta vinkeln?','Vilken sida ligger mitt emot den? Det är c.','Söker jag c eller en katet? Det avgör om jag adderar eller subtraherar kvadrater.'],rearrange:[{find:'Hypotenusan c',form:'c = √(a² + b²)',why:'De två kateternas kvadrater läggs ihop.'},{find:'Kateten a',form:'a = √(c² − b²)',why:'Flytta b² från vänster till höger.'},{find:'Kateten b',form:'b = √(c² − a²)',why:'Samma tänk åt andra hållet.'}],mistakes:['Kallar en katet för c.','Adderar sidlängderna i stället för kvadraterna.','Stannar på c² och glömmer kvadratroten.'],memory:'c sitter alltid mitt emot 90°.'},
's9-length-scale':{plain:'Längdskala jämför en längd på bilden/modellen med motsvarande längd i verkligheten.',goal:'Gå åt båda håll mellan bild och verklighet och hålla enheterna lika.',recognize:['Karta, ritning, modell eller förstoring.','Skala skrivs t.ex. 1:100 eller 2:1.','Du jämför längder – inte area eller volym.'],think:['Är detta bildens längd eller verklig längd?','Har båda samma enhet?','Ska jag förstora eller förminska?'],rearrange:[{find:'Verklig längd',form:'verklig = bild ÷ skala-faktor',why:'Vid 1:100 är verkligheten 100 gånger större.'},{find:'Bildlängd',form:'bild = verklig × skala-faktor',why:'Vid 1:100 är bilden 1/100 av verkligheten.'}],mistakes:['Blandar cm och m.','Använder areaskala på en längd.'],memory:'Samma enhet först. Sedan riktning: bild ↔ verklighet.'},
's9-area-scale':{plain:'När alla längder ändras med faktorn k ändras två dimensioner i en area. Därför blir areafaktorn k².',goal:'Räkna area både framåt och bakåt från en längd- eller areafaktor.',recognize:['Likformiga figurer och area.','Du får en längdskala men frågan gäller yta.','Area blir 4, 9, 16… gånger större eller mindre.'],think:['Vad är längdfaktorn k?','Area har två dimensioner – därför k².','Söker jag ny area eller längdfaktorn?'],rearrange:[{find:'Ny area',form:'A₂ = A₁ · k²',why:'Två längdriktningar förändras.'},{find:'Längdfaktor',form:'k = √(A₂/A₁)',why:'Gå baklänges genom att ta roten ur areafaktorn.'}],mistakes:['Multiplicerar arean bara med k.','Glömmer kvadratroten när man går bakåt.'],memory:'Längd k → area k².'},
's9-volume-scale':{plain:'Volym har tre dimensioner. Om varje längd ändras med k blir volymen k·k·k = k³ gånger så stor.',goal:'Räkna volymskala framåt och bakåt.',recognize:['Likformiga kroppar och volym.','Frågan gäller hur många gånger större en kropp blir.','Du får längdfaktor men söker volymfaktor.'],think:['Vad är längdfaktorn?','Tre dimensioner betyder kubik.','Söker jag volymfaktor eller längdfaktor?'],rearrange:[{find:'Ny volym',form:'V₂ = V₁ · k³',why:'Längd, bredd och höjd förändras.'},{find:'Längdfaktor',form:'k = ∛(V₂/V₁)',why:'Gå bakåt från kubikfaktorn.'}],mistakes:['Använder k² som om det vore area.','Glömmer kubikroten när man går bakåt.'],memory:'Längd k → area k² → volym k³.'},
's9-similarity':{plain:'Likformiga figurer har samma form men olika storlek. Alla motsvarande längder har samma skalfaktor.',goal:'Hitta motsvarande sidor och lösa en saknad längd med proportion.',recognize:['Två figurer med samma vinklar/form.','En sida saknas men motsvarande sidor finns.','Du ser ordet likformig.'],think:['Vilka sidor motsvarar varandra?','Vilken skalfaktor får jag från ett känt par?','Använder jag samma riktning i båda kvoterna?'],reverse:['Hitta först k från ett känt sidpar; använd sedan k på den okända.','Om den stora sidan är känd och lilla söks: dividera med k.'],mistakes:['Parar ihop fel sidor.','Vänder bara en av kvoterna.'],memory:'Samma form = samma skalfaktor på alla motsvarande sidor.'},
's9-symmetry':{plain:'Symmetri betyder att en figur kan speglas eller roteras och ändå passa på sig själv.',goal:'Känna igen spegel- och rotationssymmetri och bestämma symmetriordning/vinkel.',recognize:['En linje kan dela figuren i spegelbilder.','Figuren ser likadan ut efter en rotation mindre än 360°.'],think:['Kan jag vika längs en linje så halvorna matchar?','Hur många gånger under ett helt varv ser figuren likadan ut?'],reverse:['Rotationsvinkel = 360° / symmetriordning.'],mistakes:['Räknar 360° som en ny rotation.','Blandar spegellinje med rotationscentrum.'],memory:'Spegel = vik. Rotation = snurra.'},
's9-space-diagonal':{plain:'En rymddiagonal går från ett hörn i ett rätblock till det motsatta hörnet genom kroppen. Den kan byggas med Pythagoras två gånger – eller direkt.',goal:'Se den dolda triangeln i 3D och lösa rymddiagonal framåt och bakåt.',recognize:['Rätblock eller kub.','En diagonal går genom hela kroppen.','Tre vinkelräta mått l, b och h är kända.'],think:['Vilka tre längder är vinkelräta mot varandra?','Söker jag diagonalen eller en saknad kant?','Kan jag kontrollera att diagonalen är längre än varje enskild kant?'],rearrange:[{find:'Rymddiagonal d',form:'d = √(l² + b² + h²)',why:'Pythagoras i tre dimensioner.'},{find:'Saknad höjd h',form:'h = √(d² − l² − b²)',why:'Gå bakåt genom att flytta de kända kvadraterna.'}],mistakes:['Adderar l+b+h utan kvadrater.','Glömmer roten i sista steget.'],memory:'3D-Pythagoras: tre kvadrater in, en rot ut.'},
's9-percent-share':{plain:'Andelen berättar hur stor del något är av hela mängden. Procent betyder “av hundra”.',goal:'Räkna andelen när delen och det hela är kända.',recognize:['Frågan säger “hur många procent?”.','Du känner delen och totalen.'],think:['Vilket tal är delen?','Vilket tal är hela mängden?','Har jag omvandlat kvoten till procent?'],rearrange:[{find:'Andel %',form:'delen / det hela · 100',why:'Kvoten görs om till hundradelar.'}],mistakes:['Delar åt fel håll.','Glömmer ×100.'],memory:'andel = del / helhet.'},
's9-percent-part':{plain:'Delen är själva mängden som motsvarar en viss procent av det hela.',goal:'Räkna delen när procent och helhet är kända.',recognize:['“Hur mycket är 20 % av 350?”','Procent och total är kända.'],think:['Gör procent till decimal först.','Multiplicera sedan med helheten.'],rearrange:[{find:'Delen',form:'delen = andel · helhet',why:'Andelen fungerar som en faktor.'}],mistakes:['Multiplicerar med 20 i stället för 0,20.'],memory:'procent → decimal → gånger helheten.'},
's9-percent-whole':{plain:'Det hela är ursprungsmängden. Om du vet att en viss del motsvarar en viss procent kan du räkna bakåt.',goal:'Hitta helheten från del och procent.',recognize:['“30 är 20 % av vad?”','Delen och procenten är kända men totalen saknas.'],think:['Gör procent till decimal.','Dela delen med andelen.'],rearrange:[{find:'Det hela',form:'helhet = delen / andelen',why:'Det är baklänges mot delen = andel · helhet.'}],mistakes:['Multiplicerar i stället för att dividera.'],memory:'Söker du helheten? Dela.'},
's9-change-factor':{plain:'Förändringsfaktor är ett sätt att göra procentförändring till en multiplikation.',goal:'Bygga rätt faktor för ökning/minskning och gå bakåt till ursprungligt värde.',recognize:['Pris eller värde ökar/minskar med p %.','Flera procentförändringar ska kombineras.'],think:['Ökning eller minskning?','p % = p/100.','Nytt = gammalt · faktor.'],rearrange:[{find:'Nytt värde',form:'nytt = gammalt · faktor',why:'Faktorn innehåller både gamla 100 % och förändringen.'},{find:'Gammalt värde',form:'gammalt = nytt / faktor',why:'Gå bakåt genom att dividera.'}],mistakes:['20 % ökning skrivs 0,20 i stället för 1,20.','Drar samma procent tillbaka i stället för att dividera med faktorn.'],memory:'Ökning: 1 +. Minskning: 1 −.'},
's9-repeated-change':{plain:'När samma procentförändring händer flera gånger multipliceras faktorn igen och igen.',goal:'Räkna upprepade förändringar och tolka exponenten.',recognize:['“varje år”, “varje månad”, flera lika förändringar.','Samma procent upprepas n gånger.'],think:['Vilken faktor gäller per period?','Hur många perioder?','Faktorⁿ betyder samma faktor n gånger.'],reverse:['Saknas startvärdet: dela slutvärdet med faktorⁿ.','Saknas antalet perioder krävs logaritmer – inte aktuellt här om uppgiften inte anger det.'],mistakes:['Adderar procenten flera gånger i stället för att multiplicera faktorer.'],memory:'Samma förändring flera gånger = faktorⁿ.'},
's9-percentage-points':{plain:'Procentenheter mäter avståndet mellan två procenttal, inte relativ förändring.',goal:'Skilja procent från procentenheter.',recognize:['Två procentsatser jämförs, t.ex. 20 % till 30 %.','Frågan säger procentenheter.'],think:['Subtrahera procentsatserna direkt.','Om frågan i stället säger procentuell ökning måste du dividera med ursprunget.'],reverse:['20 % → 30 % = +10 procentenheter men +50 % relativt.'],mistakes:['Svarar 50 procentenheter när förändringen är 10.'],memory:'Procentenheter = avstånd mellan procentsiffror.'},
's9-percent-problem':{plain:'Procentproblem blir enklare när du först bestämmer vilken av tre saker som saknas: andelen, delen eller det hela.',goal:'Översätta textproblem till rätt procentmodell innan du räknar.',recognize:['Text med rabatt, skatt, befolkning, resultat eller förändring.'],think:['Vad är hela mängden?','Vilken del talar texten om?','Är frågan om andel, del, helhet eller förändrat värde?'],reverse:['Skriv tre ord först: DEL – HELA – PROCENT. Fyll i det du vet. Den tomma rutan är det du ska lösa.'],mistakes:['Börjar räkna innan storheterna är identifierade.'],memory:'Namnge rollerna före siffrorna.'},
'f8-fractions-compare':{plain:'För att jämföra bråk måste de tala samma språk: samma nämnare eller samma decimalform.',goal:'Avgöra vilket bråk/decimaltal som är störst och motivera.',recognize:['Två eller flera bråk/decimaler ska ordnas.'],think:['Kan jag snabbt göra decimaler?','Annars: vilken gemensam nämnare är enkel?'],reverse:['Om decimalen är given kan du ibland skriva den som bråk för att se mönstret.'],mistakes:['Jämför bara nämnarna.'],memory:'Gör talen jämförbara först.'},
'f8-fractions-add':{plain:'Bråk kan bara adderas/subtraheras direkt när delarna är lika stora – alltså samma nämnare.',goal:'Skapa gemensam nämnare, räkna täljarna och förkorta.',recognize:['Plus eller minus mellan bråk.'],think:['Har bråken samma nämnare?','Vilken minsta gemensamma nämnare fungerar?'],reverse:['Om svaret ska bli ett visst bråk kan du förlänga bakåt och se vilka täljare som behövs.'],mistakes:['Adderar både täljare och nämnare.','Glömmer förkorta.'],memory:'Samma sorts delar först – sedan räknar du hur många.'},
'f8-fractions-multiply':{plain:'När bråk multipliceras tar du en del av en del. Täljare gånger täljare, nämnare gånger nämnare.',goal:'Multiplicera och förkorta smart före eller efter.',recognize:['Multiplikation mellan bråk eller “en del av en del”.'],think:['Kan jag förkorta korsvis innan jag multiplicerar?'],reverse:['Om en faktor saknas kan du dividera med det kända bråket.'],mistakes:['Försöker hitta gemensam nämnare fast det inte behövs.'],memory:'Vid gånger: rakt över.'},
'f8-fractions-divide':{plain:'Att dividera med ett bråk betyder att multiplicera med dess invers.',goal:'Vända det andra bråket och multiplicera korrekt.',recognize:['Division mellan bråk.'],think:['Vilket bråk står efter divisionstecknet? Det är det som vänds.'],reverse:['a/b ÷ c/d = a/b · d/c.'],mistakes:['Vänder första bråket.','Vänder båda.'],memory:'Behåll – byt – vänd.'},
'f8-decimals':{plain:'Decimaler beskriver delar av ett helt. Vid plus/minus måste samma platsvärden stå under varandra.',goal:'Räkna säkert med decimaltal och rimlighetskontrollera.',recognize:['Komma-tal med +, −, × eller ÷.'],think:['Vad ungefär borde svaret bli?','Vid +/−: ligger kommatecknen under varandra?'],reverse:['Om svaret verkar 10 eller 100 gånger fel är decimalplaceringen ofta orsaken.'],mistakes:['Ställer siffrorna i stället för decimaltecknen under varandra.'],memory:'Räkna först ungefär – exakt sedan.'},
'f8-powers':{plain:'Potens är ett kort sätt att skriva samma faktor flera gånger.',goal:'Läsa och skriva potensform och förstå bas/exponent.',recognize:['Ett litet upphöjt tal.','Upprepad multiplikation.'],think:['Vilket tal är basen?','Hur många gånger multipliceras basen med sig själv?'],reverse:['2·2·2·2 = 2⁴.'],mistakes:['Tror 2⁴ betyder 2·4.'],memory:'Exponent = antal faktorer.'},
'f8-negative':{plain:'Negativa tal ligger till vänster om noll. Tecknet berättar riktning/läge, inte bara “ett minus att räkna med”.',goal:'Räkna med negativa tal och välja rätt tecken.',recognize:['Temperatur under noll, skuld, höjd under nivå, eller negativa tal i räkning.'],think:['Var på tallinjen startar jag?','Flyttar operationen mig åt höger eller vänster?','Vid ×/÷: lika tecken +, olika tecken −.'],reverse:['Om x + 5 = −2, gå fem steg tillbaka: x=−7.'],mistakes:['Blandar minus som operation med negativt tecken.'],memory:'Tallinjen för +/−; teckenregel för ×/÷.'},
'f8-simplify-fraction':{plain:'Att förkorta ändrar inte bråkets värde. Du delar täljare och nämnare med samma tal.',goal:'Hitta gemensam faktor och skriva enklaste form.',recognize:['“Förkorta”, “enklaste form”.'],think:['Vilket tal delar både täljare och nämnare?','Kan jag dela en gång till?'],reverse:['Att förlänga är motsatsen: multiplicera båda med samma tal.'],mistakes:['Delar bara täljaren eller bara nämnaren.'],memory:'Samma operation uppe och nere.'},
'f8-units':{plain:'Enhetsbyten är olika beroende på dimension: längd har ett steg, area två och volym tre.',goal:'Välja rätt faktor och undvika 10/100/1000-missar.',recognize:['mm, cm, dm, m eller motsvarande kvadrat/kubik.'],think:['Är det längd, area eller volym?','Hur många enhetssteg flyttar jag?','Vilken riktning – till mindre eller större enhet?'],reverse:['Längd: varje steg ×10/÷10. Area: ×100/÷100. Volym: ×1000/÷1000.'],mistakes:['Använder ×10 även för cm² eller cm³.'],memory:'Dimensionen bestämmer hur starkt steget blir.'},
'f8-perimeter':{plain:'Omkrets är längden runt kanten – som ett snöre runt figuren.',goal:'Identifiera alla ytterkanter och summera dem.',recognize:['“Runt”, “staket”, “kant”, “omkrets”.'],think:['Vilka sidor ligger på ytterkanten?','Finns lika sidor jag kan gruppera?'],reverse:['Om omkrets och alla utom en sida är kända: saknad sida = omkrets − övriga sidor.'],mistakes:['Räknar area i stället för kantlängd.'],memory:'Omkrets = gå runt.'},
'f8-area':{plain:'Area är hur mycket yta en figur täcker. Den mäts i kvadratenheter.',goal:'Välja areaformel och även lösa bakåt för bas/höjd.',recognize:['“yta”, “golv”, “måla”, cm²/m².'],think:['Vilken figur är det?','Vilka mått hör till formeln?','Söker jag area eller ett saknat mått?'],rearrange:[{find:'Rektangelarea',form:'A = b·h',why:'Rader × kolumner.'},{find:'Höjd',form:'h = A/b',why:'Gå bakåt från multiplikation.'},{find:'Triangelarea',form:'A = b·h/2',why:'Triangeln är halva en motsvarande rektangel.'}],mistakes:['Glömmer /2 för triangel.','Skriver cm i stället för cm².'],memory:'Area = inuti figuren.'},
'f8-circle-circ':{plain:'Cirkelns omkrets är längden runt cirkeln. π kopplar omkretsen till diameter/radie.',goal:'Räkna omkrets och gå bakåt till radie eller diameter.',recognize:['“runt cirkeln”, omkrets, däck, kant.'],think:['Har jag radie eller diameter?','O = 2πr eller πd – välj den som passar direkt.'],rearrange:[{find:'Omkrets O',form:'O = 2πr = πd',why:'Diameter är 2r.'},{find:'Radie r',form:'r = O/(2π)',why:'Dela bort 2π.'},{find:'Diameter d',form:'d = O/π',why:'Dela bort π.'}],mistakes:['Använder πr² – det är area.','Blandar r och d.'],memory:'Runt = 2πr.'},
'f8-circle-area':{plain:'Cirkelns area är ytan inuti cirkeln. Radien måste kvadreras.',goal:'Räkna area och gå bakåt från area till radie.',recognize:['“yta inuti cirkeln”, cm²/m².'],think:['Har jag radien? Om jag har diameter, halvera först.','Söker jag A eller r?'],rearrange:[{find:'Area A',form:'A = πr²',why:'Radien styr ytan i två dimensioner.'},{find:'Radie r',form:'r = √(A/π)',why:'Dela bort π och ta sedan roten.'}],mistakes:['Använder diametern som r.','Glömmer kvadraten.','Använder omkretsformeln.'],memory:'Inuti = πr².'},
'f8-sector':{plain:'En sektor är en bit av en cirkel. Vinkeln berättar hur stor del av hela 360° du har.',goal:'Räkna båglängd eller sektorarea från vinkelandel.',recognize:['Tårtbit/pizzabit, centralvinkel, båge.'],think:['Vilken andel av hela varvet är v/360?','Söker jag kantlängd (båge) eller yta (sektor)?'],rearrange:[{find:'Båglängd',form:'v/360 · 2πr',why:'Ta samma andel av hela omkretsen.'},{find:'Sektorarea',form:'v/360 · πr²',why:'Ta samma andel av hela arean.'}],mistakes:['Tar andel av fel helhet.'],memory:'v/360 × hela cirkelns motsvarande storhet.'},
'f8-volume-units':{plain:'Volym är hur mycket som ryms i en kropp. Tre dimensioner ger kubikenheter.',goal:'Räkna rätblocksvolym och omvandla volymenheter.',recognize:['“rymmer”, “volym”, cm³, liter.'],think:['Vilka tre vinkelräta mått behöver jag?','Är alla i samma enhet?'],rearrange:[{find:'Volym',form:'V = l·b·h',why:'Tre dimensioner multipliceras.'},{find:'En kant',form:'h = V/(l·b)',why:'Dela bort de två kända dimensionerna.'}],mistakes:['Blandar cm² och cm³.'],memory:'Volym = tre mått.'},
'f8-cylinder':{plain:'En cylinder är som många lika stora cirklar staplade på höjden. Därför är volymen basarea gånger höjd.',goal:'Räkna V, h eller r genom att förstå basarea πr².',recognize:['Burk/rör/cylinder med cirkulär bas.'],think:['Hitta basens radie.','Räkna basarean πr².','Multiplicera med höjden – eller lös bakåt.'],rearrange:[{find:'Volym V',form:'V = πr²h',why:'Basarea × höjd.'},{find:'Höjd h',form:'h = V/(πr²)',why:'Dela bort basarean.'},{find:'Radie r',form:'r = √(V/(πh))',why:'Dela bort πh och ta roten.'}],mistakes:['Glömmer r².','Använder diameter som radie.'],memory:'Cylinder = cirkelarea × höjd.'},
'f8-pyramid':{plain:'En pyramid med samma bas och höjd som ett prisma rymmer en tredjedel så mycket.',goal:'Räkna pyramidvolym och lösa bakåt.',recognize:['Spetsig kropp med polygon som bas.'],think:['Vad är basarean B?','Vad är den vinkelräta höjden?','Kom ihåg tredjedelen.'],rearrange:[{find:'Volym V',form:'V = B·h/3',why:'Pyramid = en tredjedel av motsvarande prisma.'},{find:'Höjd h',form:'h = 3V/B',why:'Multiplicera med 3, dela med B.'}],mistakes:['Glömmer /3.','Använder sned kant som höjd.'],memory:'Pyramid = bas × höjd ÷ 3.'},
'f8-cone':{plain:'En kon är cirkelns motsvarighet till en pyramid: basen är en cirkel och volymen är en tredjedel av cylindern.',goal:'Räkna konvolym och lösa bakåt.',recognize:['Kon, cirkulär bas, spets.'],think:['Radie först.','Basarea πr².','Sedan ×h ÷3.'],rearrange:[{find:'Volym V',form:'V = πr²h/3',why:'En tredjedel av cylindern.'},{find:'Höjd h',form:'h = 3V/(πr²)',why:'Gå bakåt.'}],mistakes:['Glömmer /3.','Tar mantellängden som höjd.'],memory:'Kon = cylinder ÷ 3.'},
'f8-sphere':{plain:'Ett klot är tredimensionellt runt i alla riktningar. Volymen växer med radien i kubik.',goal:'Använda klotets volymformel och förstå varför r³ gör stor skillnad.',recognize:['Boll/klot och volym.'],think:['Har jag radie eller diameter?','Om diameter: halvera först.'],rearrange:[{find:'Volym V',form:'V = 4πr³/3',why:'Klotets standardformel.'}],mistakes:['Använder r² i stället för r³.','Glömmer halvera diameter.'],memory:'Klotvolym = 4/3 πr³.'},
'f8-surface-area':{plain:'Begränsningsyta är all utsida du skulle behöva måla eller slå in.',goal:'Dela upp en kropp i ytor, räkna varje area och summera.',recognize:['“utsida”, “måla”, “papper runt”, begränsningsyta.'],think:['Vilka ytor finns?','Finns lika ytor som kan räknas tillsammans?','Är någon sida öppen och ska därför inte med?'],reverse:['Om total yta och alla utom en delyta är kända: saknad yta = total − övriga.'],mistakes:['Räknar volym i stället för yta.','Glömmer en bas eller räknar en dold/öppen yta fel.'],memory:'Tänk presentpapper – bara utsidan.'},
'f8-density':{plain:'Befolkningstäthet berättar hur många människor som i genomsnitt finns per areaenhet.',goal:'Räkna täthet och gå bakåt till invånare eller area.',recognize:['Invånare per km² eller liknande.'],think:['Vilket är antal?','Vilken är area?','Vilken enhet ska svaret ha?'],rearrange:[{find:'Täthet',form:'täthet = antal/area',why:'Hur många per areaenhet.'},{find:'Antal',form:'antal = täthet·area',why:'Gå bakåt från “per”.'},{find:'Area',form:'area = antal/täthet',why:'Gå bakåt till ytan.'}],mistakes:['Vänder divisionen.'],memory:'per betyder dividerat med.'},
'f8-expressions':{plain:'Ett algebraiskt uttryck är en räknebeskrivning utan likhetstecken. Lika termer kan samlas.',goal:'Känna igen lika termer och förenkla utan att ändra värdet.',recognize:['x-termer och tal utan =.','Frågan säger förenkla.'],think:['Vilka termer har exakt samma variabeldel?','Konstanter samlas med konstanter.'],reverse:['5x kan delas upp som 3x+2x om du behöver se hur termer byggs.'],mistakes:['Slår ihop 3x och 2 till 5x.'],memory:'Bara samma sort får samlas.'},
'f8-equations':{plain:'En ekvation är en balans. Målet är att få x ensamt utan att balansen tippar.',goal:'Lösa ekvationer genom motsatta operationer och kontrollera genom insättning.',recognize:['Likhetstecken och okänt x.'],think:['Vad görs med x just nu?','Vilken motsatt operation tar bort det?','Gör samma på båda sidor.'],reverse:['+5 tas bort med −5.','·3 tas bort med ÷3.','/4 tas bort med ·4.'],mistakes:['Gör operationen bara i ena ledet.','Byter tecken utan att tänka operation.'],memory:'Balans: samma sak på båda sidor.'},
'f8-x-both-sides':{plain:'När x finns på båda sidor samlar du alla x-termer på ena sidan och vanliga tal på den andra.',goal:'Välja den sida som gör lösningen enkel och undvika teckenfel.',recognize:['x förekommer i båda leden.'],think:['Vilken x-term är minst? Flytta gärna den för att hålla x-koefficienten positiv.','Samla x först, tal sedan.'],reverse:['3x+5=x+13 → ta bort x från båda: 2x+5=13.'],mistakes:['Flyttar termer genom magiskt teckenbyte utan samma operation i båda leden.'],memory:'Samla samma sort på samma sida.'},
'f8-parentheses-add':{plain:'Ett plustecken framför parentes ändrar inget. Ett minustecken framför parentes byter tecken på varje term inuti.',goal:'Ta bort parenteser korrekt vid plus och minus.',recognize:['+ (...) eller − (...) utan multiplikation.'],think:['Vilket tecken står framför parentesen?','Om minus: har varje term bytt tecken?'],reverse:['a−b−c kan samlas som a−(b+c).'],mistakes:['Byter bara första tecknet efter minusparentes.'],memory:'Minus framför parentes → alla tecken vänder.'},
'f8-parentheses-multiply':{plain:'Multiplikation framför en parentes ska delas ut till varje term inuti.',goal:'Multiplicera in och även känna igen när du kan faktorisera tillbaka.',recognize:['Ett tal/uttryck direkt framför parentes.'],think:['Har jag multiplicerat med varje term?','Finns minus som påverkar tecknen?'],reverse:['3x+6 = 3(x+2) – detta är vägen tillbaka.'],mistakes:['Multiplicerar bara första termen.'],memory:'Pilen går till alla termer.'},
'f8-equation-problems':{plain:'Textproblem med ekvation handlar om att översätta en berättelse till en balans med ett okänt tal.',goal:'Definiera x, bygga ekvation, lösa och tolka svaret i textens verklighet.',recognize:['Text med ett okänt antal/pris/längd och samband mellan mängder.'],think:['Vad ska x betyda? Skriv det i ord.','Vilka två uttryck är lika?','Passar svaret tillbaka i berättelsen?'],reverse:['Om du kan gissa svaret kan du kontrollera genom att sätta in det i berättelsens relation.'],mistakes:['Börjar räkna utan att definiera x.','Svarar med x men utan att tolka vad x betyder.'],memory:'Text → x betyder → ekvation → lös → kontroll.'},
'f8-conjugate':{plain:'Konjugatregeln är en genväg när samma två termer har plus i ena parentesen och minus i den andra.',goal:'Känna igen mönstret och använda a²−b².',recognize:['(a+b)(a−b) – exakt samma termer, olika tecken.'],think:['Är parenteserna verkligen konjugat?','Vad är a och vad är b?'],reverse:['a²−b² kan faktoriseras till (a+b)(a−b).'],mistakes:['Använder regeln på parenteser som inte är konjugat.'],memory:'Plus/minus-paret tar bort mittentermerna.'},

};
window.MATTE_PEDAGOGY=P;
})();
</script><script>(()=>{
'use strict';
const DATA=window.MATTE_DATA;
const PED=window.MATTE_PEDAGOGY||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const clone=o=>JSON.parse(JSON.stringify(o));
const APP_VERSION='2.0.0';
const DB_NAME='matte-os-db', STORE='kv', KEY='state';
let installPrompt=null;
let route={view:'home',skillId:null,chapterId:null,stage:0,reveal:1};
let session=null;
let searchOpen=false;

const defaultState=()=>({
 version:1,appVersion:APP_VERSION,activeProfile:'grade9',
 settings:{largeText:false,reduceMotion:false},
 profiles:Object.fromEntries(Object.entries(DATA.profiles).map(([id,p])=>[id,{attempts:[],restExams:clone(p.restExams),createdRestExams:[],xp:0,earnedBadges:[]}]))
});
let state=defaultState();
function ensureStateShape(){
 if(!state.settings)state.settings={largeText:false,reduceMotion:false};
 for(const id of Object.keys(DATA.profiles)){
  state.profiles??={};
  if(!state.profiles[id])state.profiles[id]={attempts:[],restExams:clone(DATA.profiles[id].restExams),createdRestExams:[],xp:0,earnedBadges:[]};
  const ps=state.profiles[id];ps.attempts??=[];ps.restExams??=clone(DATA.profiles[id].restExams);ps.createdRestExams??=[];ps.xp??=0;ps.earnedBadges??=[];
 }
 state.appVersion=APP_VERSION;
}
function pedagogy(s){return PED[s.id]||{plain:s.subtitle,goal:'Förstå idén, känna igen uppgiftstypen och kunna lösa den själv.',recognize:[s.when],think:['Vad vet jag?','Vad söker jag?','Vilken regel kopplar ihop dem?'],reverse:['Arbeta bakåt från det som söks.'],mistakes:['Kontrollera enhet och rimlighet.'],memory:s.rule}}
function levelInfo(){const xp=pstate().xp||0;const levels=[['Upptäckare',0],['Metoddetektiv',80],['Problemlösare',220],['Strateg',450],['Mattepilot',800]];let cur=levels[0],next=null;for(let i=0;i<levels.length;i++){if(xp>=levels[i][1])cur=levels[i];else{next=levels[i];break}}return{name:cur[0],xp,next,progress:next?Math.round((xp-cur[1])/(next[1]-cur[1])*100):100}}
function skillStars(id){const st=statusInfo(id);return Math.min(5,st.level+Math.min(1,attemptsFor(id).filter(a=>a.correct&&!a.hintsUsed).length>0?1:0))}
function currentSkillPed(){const item=session?.items?.[session.index];return item?pedagogy(skillById(item.skillId)):null}

function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return resolve(null);const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function lsGet(){try{return window.localStorage?.getItem(KEY)||null}catch{return null}}
function lsSet(v){try{window.localStorage?.setItem(KEY,v)}catch{}}
async function loadState(){try{const db=await openDB();if(!db){const raw=lsGet();return raw?JSON.parse(raw):defaultState()}return await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).get(KEY);req.onsuccess=()=>resolve(req.result||defaultState());req.onerror=()=>reject(req.error)})}catch(e){console.warn('state load fallback',e);const raw=lsGet();return raw?JSON.parse(raw):defaultState()}}
async function saveState(){try{const db=await openDB();if(!db){lsSet(JSON.stringify(state));return}await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){lsSet(JSON.stringify(state))}}

function profile(){return DATA.profiles[state.activeProfile]}
function pstate(){return state.profiles[state.activeProfile]}
function skillById(id){return DATA.skills.find(s=>s.id===id)}
function chapterById(id){return profile().chapters.find(c=>c.id===id)}
function skillChapter(skillId){return profile().chapters.find(c=>c.skills.includes(skillId))}
function allRestExams(){return [...pstate().restExams,...pstate().createdRestExams]}

function isoWeek(d=new Date()){
 const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
 const day=date.getUTCDay()||7;date.setUTCDate(date.getUTCDate()+4-day);
 const start=new Date(Date.UTC(date.getUTCFullYear(),0,1));
 return Math.ceil((((date-start)/86400000)+1)/7);
}
function daysUntil(dateStr){if(!dateStr)return null;const now=new Date();now.setHours(0,0,0,0);const d=new Date(dateStr+'T00:00:00');return Math.ceil((d-now)/86400000)}
function fmtDate(dateStr){if(!dateStr)return 'Datum saknas';return new Intl.DateTimeFormat('sv-SE',{day:'numeric',month:'short'}).format(new Date(dateStr+'T00:00:00'))}
function currentPlan(){const w=isoWeek();return profile().plan.find(x=>x.week===w)||profile().plan.find(x=>x.week>w)||profile().plan.at(-1)}
function nextChapterExam(){const w=isoWeek();return profile().chapters.find(c=>c.examWeek>=w)||null}
function attemptsFor(skillId){return pstate().attempts.filter(a=>a.skillId===skillId)}
function statusInfo(skillId){
 const a=attemptsFor(skillId);if(!a.length)return{level:0,label:'Inte startad',score:0,cls:'s0'};
 const correct=a.filter(x=>x.correct), wrong=a.filter(x=>!x.correct), noHint=correct.filter(x=>!x.hintsUsed&&x.mode!=='worked');
 const days=[...new Set(noHint.map(x=>x.ts.slice(0,10)))];
 if(noHint.length>=3&&days.length>=2)return{level:4,label:'Sitter',score:100,cls:'s4'};
 if(noHint.length>=2)return{level:3,label:'Kan själv',score:85,cls:'s3'};
 if(correct.length)return{level:2,label:'Kan med stöd',score:60,cls:'s2'};
 if(wrong.length)return{level:1,label:'Kan inte ännu',score:25,cls:'s1'};
 return{level:0,label:'Inte startad',score:0,cls:'s0'};
}
function chapterProgress(ch){if(!ch.skills.length)return 0;return Math.round(ch.skills.reduce((s,id)=>s+statusInfo(id).score,0)/ch.skills.length)}
function overallProgress(){const ids=profile().chapters.flatMap(c=>c.skills);return ids.length?Math.round(ids.reduce((s,id)=>s+statusInfo(id).score,0)/ids.length):0}
function weakSkills(ids){return ids.map(id=>({id,st:statusInfo(id)})).sort((a,b)=>a.st.score-b.st.score).map(x=>x.id)}
function recommendedSkill(){
 const rests=allRestExams().filter(r=>r.date&&daysUntil(r.date)>=0).sort((a,b)=>new Date(a.date)-new Date(b.date));
 if(rests.length){const ids=weakSkills(rests[0].skillIds);if(ids.length)return ids[0]}
 const cur=profile().chapters.find(c=>c.status==='current')||profile().chapters[0];
 return weakSkills(cur.skills)[0];
}
function toast(msg){const el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}

function setTheme(){document.body.classList.toggle('theme-navy',state.activeProfile==='grade8');document.body.classList.toggle('theme-burgundy',state.activeProfile==='grade9');document.body.classList.toggle('large-text',!!state.settings.largeText);document.body.classList.toggle('reduce-motion',!!state.settings.reduceMotion);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',profile().accent)}

function icon(name){const m={home:'⌂',plan:'◫',library:'◇',practice:'✎',progress:'◎',rest:'↺',search:'⌕',settings:'⚙',test:'◆',book:'▤'};return m[name]||'•'}
function nav(){const items=[['home','Hem'],['plan','Plan'],['library','Bibliotek'],['practice','Öva'],['rest','Restprov'],['progress','Min karta']];return `<nav class="bottomnav">${items.map(([v,l])=>`<button data-nav="${v}" class="${route.view===v?'active':''}"><b>${icon(v)}</b><span>${l}</span></button>`).join('')}</nav>`}
function shell(content){
 const p=profile();
 return `<div class="app-shell"><header class="topbar"><div class="topbar-inner">
  <div class="brand" data-nav="home" role="button" tabindex="0"><div class="brand-mark">M</div><div><b>MATTE OS</b><small>${esc(DATA.meta.scope)}</small></div></div>
  <div class="search-wrap"><span class="search-icon">${icon('search')}</span><input id="globalSearch" class="search" autocomplete="off" placeholder="Sök: hypotenusa, bråk, procent, x i båda leden…"/><div id="searchResults"></div></div>
  <button class="profile-switch" id="profileSwitch"><span class="avatar">${p.name[0]}</span><span class="pname"><b>${esc(p.name)}</b><small style="display:block;color:var(--muted)">Åk ${p.grade} · ${esc(levelInfo().name)}</small></span><span class="xp-chip">${pstate().xp||0} ✦</span><span>⌄</span></button>
 </div></header><main>${content}</main>${nav()}</div>`;
}

function render(){setTheme();let content='';switch(route.view){
 case'home':content=renderHome();break;case'plan':content=renderPlan();break;case'library':content=renderLibrary();break;case'skill':content=renderSkill(route.skillId);break;case'practice':content=renderPracticeHub();break;case'session':content=renderSession();break;case'rest':content=renderRest();break;case'progress':content=renderProgress();break;case'settings':content=renderSettings();break;default:content=renderHome();}
 $('#app').innerHTML=shell(content);bindCommon();if(route.view==='session')bindSession();
}

function renderHome(){
 const p=profile(), cp=currentPlan(), exam=nextChapterExam(), rec=skillById(recommendedSkill()), op=overallProgress();
 const datedRests=allRestExams().filter(r=>r.date).sort((a,b)=>new Date(a.date)-new Date(b.date));
 const nearestRest=datedRests.find(r=>daysUntil(r.date)>=0);const undated=allRestExams().filter(r=>!r.date);
 return `<section class="hero"><div class="hero-grid"><div><div class="eyebrow">${esc(p.name)} · ÅRSKURS ${p.grade} · VECKA ${isoWeek()}</div><h1>${cp?.area==='Höstlov'?'Höstlov. Vi tränar smart, inte länge.':esc(cp?.area||'Matematik')}</h1><p>${esc(cp?.detail||'Din plan finns här.')} Appen prioriterar aktuellt område, restprov och sådant som ännu inte sitter.</p></div><div class="hero-side"><div class="eyebrow">HELA HT-26</div><strong>${op}% av färdigheterna</strong><div class="progress-track" style="margin-top:12px;background:rgba(255,255,255,.2)"><div class="progress-fill" style="width:${op}%;background:#fff"></div></div><div class="meta"><span>${profile().chapters.length} kapitel</span><span>${profile().chapters.reduce((n,c)=>n+c.skills.length,0)} metodkort</span></div></div></div></section>
 <section class="section"><div class="section-head"><div><h2>Det viktigaste nu</h2><p>Prioriterat från skolplan + din progression.</p></div><div class="section-actions"><button class="btn btn-secondary" data-nav="settings">${icon('settings')} Inställningar</button></div></div>
 <div class="grid grid-3">
  <div class="card"><div class="kicker">JUST NU I SKOLAN</div><h3>Vecka ${cp.week} · ${esc(cp.area)}</h3><p>${esc(cp.detail)}</p><div style="margin-top:14px"><span class="pill neutral">${esc(cp.pages)}</span></div></div>
  <div class="card"><div class="kicker">NÄSTA KAPITELPROV</div>${exam?`<h3>${esc(exam.name.replace('Kapitel ','').replace(' · ',' — '))}</h3><p>Planerat i <b>vecka ${exam.examWeek}</b>. Exakt provdatum finns inte i terminsplanen.</p><div style="margin-top:14px"><button class="btn btn-soft" data-start-chapter="${exam.id}" data-mode="test">Provträna</button></div>`:'<h3>Inget fler prov i planen</h3>'}</div>
  <div class="card ${nearestRest?'':'clickable'}" ${nearestRest?'':'data-nav="rest"'}><div class="kicker">RESTPROV</div>${nearestRest?`<h3>${esc(nearestRest.title)}</h3><p>${fmtDate(nearestRest.date)} · <b>${daysUntil(nearestRest.date)} dagar kvar</b></p><div style="margin-top:14px"><button class="btn btn-primary" data-start-rest="${nearestRest.id}">Träna nu</button></div>`:`<h3>${undated.length?undated.length+' restprov behöver datum':'Inget restprov med datum'}</h3><p>${undated.length?'Lägg in datum så prioriterar appen automatiskt.':'Du kan lägga till ett restprov när skolan ger datum.'}</p>`}</div>
 </div></section>
 <section class="section"><div class="section-head"><div><h2>Nästa bästa steg</h2><p>Den svagaste relevanta färdigheten just nu.</p></div></div>${rec?renderRecommended(rec):''}</section>
 <section class="section"><div class="section-head"><div><h2>Snabbstart</h2><p>Ingen menyjakt.</p></div></div><div class="quick">
  <button data-start-auto="current"><span class="qicon">✎</span><b>10 min öva</b><span>Aktuellt kapitel + svagheter</span></button>
  <button data-nav="library"><span class="qicon">⌕</span><b>Hitta en regel</b><span>Sök i hela din HT-26</span></button>
  <button data-start-auto="test"><span class="qicon">◆</span><b>Testa mig</b><span>Blandat utan metodnamn</span></button>
  <button data-nav="rest"><span class="qicon">↺</span><b>Restprov</b><span>Datum, innehåll och träning</span></button>
 </div></section>
 <section class="section"><div class="section-head"><div><h2>Dina kapitel</h2><p>Från terminsstart till repetition.</p></div><button class="btn btn-secondary" data-nav="plan">Visa hela studieplanen</button></div><div class="grid grid-3">${p.chapters.map(ch=>chapterSummary(ch)).join('')}</div></section>`;
}
function renderRecommended(s){const st=statusInfo(s.id);return `<div class="card clickable" data-skill="${s.id}"><div class="grid grid-2" style="align-items:center"><div><div class="kicker">${esc(s.chapter)} · <span class="status-dot ${st.cls}"></span>${st.label}</div><h3 style="font-size:1.5rem">${esc(s.title)}</h3><p>${esc(s.when)}</p><div style="margin-top:15px"><span class="pill">${esc(s.rule)}</span></div></div><div><div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:${st.score}%"></div></div><small>${st.score}%</small></div><button style="margin-top:16px" class="btn btn-primary" data-start-skill="${s.id}">Öva ${s.title}</button></div></div></div>`}
function chapterSummary(ch){const pc=chapterProgress(ch);return `<div class="card clickable" data-chapter="${ch.id}"><div class="kicker">${ch.status==='current'?'AKTUELLT':ch.status==='past'?'TIDIGARE':'KOMMER'}</div><h3>${esc(ch.name)}</h3><p>${ch.skills.length} metodkort · prov vecka ${ch.examWeek}</p><div class="progress-row" style="margin-top:15px"><div class="progress-track"><div class="progress-fill" style="width:${pc}%"></div></div><small>${pc}%</small></div></div>`}

function renderPlan(){const w=isoWeek();return `<section class="section" style="margin-top:0"><div class="section-head"><div><div class="kicker">KÄLLA: SKOLANS HT-26-PLANERING</div><h2>${profile().name} · årskurs ${profile().grade}</h2><p>Exakt ordning och sidor från planeringen i Drive. Provdatum som inte anges exakt visas bara som vecka.</p></div></div><div class="timeline">${profile().plan.map(x=>`<div class="week-row ${x.week===w?'current':''} ${x.exam?'exam':''}"><div class="week-no">v.${x.week}<small style="display:block;font-family:inherit;color:var(--muted);font-weight:500">${esc(x.range)}</small></div><div><strong>${esc(x.area)}</strong><small>${esc(x.detail)} · ${esc(x.pages)}</small></div>${x.exam?'<span class="pill bad">PROV</span>':x.week===w?'<span class="pill">NU</span>':''}</div>`).join('')}</div></section>`}

function renderLessonPath(stage){return `<div class="lesson-path">${lessonStages().map((x,i)=>`<button class="lesson-step ${i===stage?'active':''} ${i<stage?'done':''}" data-lesson-stage="${i}"><span>${i<stage?'✓':x[0]}</span><b>${x[1]}</b></button>`).join('')}</div>`}

function renderStageContent(s,p,stage){
 if(stage===0)return `<div class="focus-grid"><div class="focus-copy"><div class="focus-label">FÖRSTÅ UTAN ATT RÄKNA</div><h2>${esc(p.plain)}</h2><div class="goal-card"><span>🎯</span><div><b>När du är klar</b><p>${esc(p.goal)}</p></div></div><div class="memory-anchor"><span>MINNESBILD</span><b>${esc(p.memory)}</b></div></div><div class="concept-visual">${renderVisual(s.visual,s)}</div></div>`;
 if(stage===1)return `<div class="stage-stack"><div class="stage-intro"><span class="stage-icon">⌕</span><div><h2>Hur känner jag igen uppgiften?</h2><p>Titta efter signalerna innan du väljer en formel.</p></div></div><div class="recognition-grid">${p.recognize.map((x,i)=>`<div class="recognition-card"><span>${i+1}</span><p>${esc(x)}</p></div>`).join('')}</div><div class="concept-visual slim">${renderVisual(s.visual,s)}</div><div class="micro-coach"><b>Stanna 3 sekunder.</b> Fråga: <em>”Vilken av de här signalerna ser jag i uppgiften?”</em></div></div>`;
 if(stage===2)return `<div class="stage-stack"><div class="stage-intro"><span class="stage-icon">↔</span><div><h2>Välj väg innan du räknar</h2><p>Matte är ofta samma samband åt olika håll. Det viktiga är vad som saknas.</p></div></div><div class="think-grid">${p.think.map((x,i)=>`<div class="think-card"><small>FRÅGA ${i+1}</small><b>${esc(x)}</b></div>`).join('')}</div>${renderFormulaMoves(s,p)}<div class="mistake-lab"><div><span>⚠</span><b>Vanliga fällor</b></div><ul>${p.mistakes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`;
 if(stage===3){const n=Math.max(1,Math.min(route.reveal||1,s.example.steps.length));return `<div class="stage-stack"><div class="stage-intro"><span class="stage-icon">◉</span><div><h2>Se hur tanken byggs</h2><p>Vi visar ett steg i taget. Försök förutse nästa steg innan du öppnar det.</p></div></div><div class="worked-layout"><div class="worked-visual">${renderVisual(s.visual,s,s.example)}</div><div class="worked-example-v2"><div class="problem-chip">${esc(s.example.problem)}</div>${s.example.steps.map((x,i)=>`<div class="worked-step ${i<n?'shown':'locked'}"><span>${i+1}</span><div>${i<n?`<b>${esc(x)}</b><small>${esc((p.think||[])[Math.min(i,(p.think||[]).length-1)]||'Kontrollera vad detta steg gör.')}</small>`:'<b>Förutse nästa steg…</b>'}</div></div>`).join('')}<div class="worked-answer ${n>=s.example.steps.length?'shown':'locked'}">Svar: ${n>=s.example.steps.length?esc(s.example.answer):'öppnas efter sista steget'}</div><div class="section-actions">${n<s.example.steps.length?`<button class="btn btn-primary" data-reveal-next>Visa nästa steg</button>`:`<button class="btn btn-soft" data-lesson-stage="4">Jag vill prova →</button>`}<button class="btn btn-secondary" data-reset-reveal>Börja om stegvis</button></div></div></div></div>`}
 if(stage===4){const e=s.exercises[0];return `<div class="stage-stack"><div class="stage-intro"><span class="stage-icon">✎</span><div><h2>Vi gör en tillsammans</h2><p>Först orientering, sedan metodval, sist beräkning. Du får stöd när du behöver det.</p></div></div><div class="guided-preview"><div class="exercise-visual">${renderExerciseVisual(s,e)}</div><div><div class="kicker">UPPGIFT</div><h3>${esc(e.prompt)}</h3><div class="guide-questions"><span>1</span><p><b>Vad vet jag?</b> Markera de givna talen och enheterna.</p><span>2</span><p><b>Vad söker jag?</b> Namnge det okända innan du räknar.</p><span>3</span><p><b>Vilken väg?</b> Välj samband/formel som binder ihop det kända och okända.</p></div><button class="btn btn-primary" data-start-guided="${s.id}">Starta tillsammans →</button></div></div></div>`}
 return `<div class="stage-stack"><div class="stage-intro"><span class="stage-icon">★</span><div><h2>Behärska – från stöd till självständigt</h2><p>Tre varianter. De ser lika ut på ytan, men kräver att du väljer riktning själv.</p></div></div><div class="mastery-grid">${s.exercises.map((e,i)=>`<article class="mastery-card"><div class="exercise-mini-visual">${renderExerciseVisual(s,e)}</div><small>${i===0?'MED STÖD':i===1?'MINDRE STÖD':'SJÄLV'}</small><p>${esc(e.prompt)}</p></article>`).join('')}</div><div class="mastery-cta"><div><span class="stars">${'★'.repeat(skillStars(s.id))}${'☆'.repeat(5-skillStars(s.id))}</span><p>Stjärnor bygger på faktisk träning, inte bara på att sidan öppnats.</p></div><button class="btn btn-primary" data-start-skill="${s.id}">Starta 3-stegspasset</button></div></div>`
}
function renderSkill(id){const s=skillById(id);if(!s)return renderLibrary();const st=statusInfo(id),p=pedagogy(s),stage=Math.max(0,Math.min(5,Number(route.stage)||0));return `<section class="lesson-page"><div class="lesson-toolbar"><button class="btn btn-secondary" data-nav="library">← Bibliotek</button><div class="lesson-status"><span class="status-dot ${st.cls}"></span>${st.label}<span class="stars">${'★'.repeat(skillStars(id))}${'☆'.repeat(5-skillStars(id))}</span></div></div><div class="lesson-header"><div><div class="kicker">${esc(s.chapter)} · ${profile().name.toUpperCase()} · ÅK ${profile().grade}</div><h1>${esc(s.title)}</h1><p>${esc(s.subtitle)}</p></div><div class="lesson-formula"><small>KÄRNA</small><b>${esc(s.rule)}</b></div></div>${renderLessonPath(stage)}<div class="lesson-focus">${renderStageContent(s,p,stage)}</div><div class="lesson-controls"><button class="btn btn-secondary" data-lesson-prev ${stage===0?'disabled':''}>← Föregående</button><div><small>Steg ${stage+1} av 6</small><div class="mini-progress"><i style="width:${(stage+1)/6*100}%"></i></div></div><button class="btn btn-primary" data-lesson-next ${stage===5?'disabled':''}>Nästa steg →</button></div></section>`}

function renderPracticeHub(){const cur=profile().chapters.find(c=>c.status==='current');return `<section class="hero"><div class="hero-grid"><div><div class="eyebrow">ÖVA</div><h1>Kort, riktat och rättat direkt.</h1><p>Välj aktuellt kapitel, svaga färdigheter eller provläge. Hjälpen trappas upp först när du ber om den.</p></div><div class="hero-side"><strong>Din status: ${overallProgress()}%</strong><div class="meta"><span>${pstate().attempts.length} försök sparade</span><span>lokalt på enheten</span></div></div></div></section>
 <section class="section"><div class="grid grid-3"><div class="card"><div class="kicker">REKOMMENDERAT</div><h3>10 min · ${esc(cur.name)}</h3><p>Svagaste färdigheterna i det ni arbetar med nu.</p><button class="btn btn-primary btn-wide" style="margin-top:16px" data-start-auto="current">Starta</button></div><div class="card"><div class="kicker">BLANDAT PROVLÄGE</div><h3>Utan metodnamn</h3><p>Frågan säger inte vilken regel som behövs. Ingen hint förrän efteråt.</p><button class="btn btn-secondary btn-wide" style="margin-top:16px" data-start-auto="test">Testa mig</button></div><div class="card"><div class="kicker">RESTPROV</div><h3>Träna efter datum</h3><p>Appen prioriterar restprov som fått ett datum.</p><button class="btn btn-soft btn-wide" style="margin-top:16px" data-nav="rest">Öppna restprov</button></div></div></section>
 <section class="section"><div class="section-head"><div><h2>Välj kapitel</h2></div></div><div class="grid grid-3">${profile().chapters.map(ch=>`<div class="card"><h3>${esc(ch.name)}</h3><p>${ch.skills.length} färdigheter · ${chapterProgress(ch)}% progression</p><div class="section-actions" style="margin-top:14px"><button class="btn btn-soft" data-start-chapter="${ch.id}" data-mode="practice">Öva</button><button class="btn btn-secondary" data-start-chapter="${ch.id}" data-mode="test">Provträna</button></div></div>`).join('')}</div></section>`}

function renderRest(){const rests=allRestExams();return `<section class="section" style="margin-top:0"><div class="section-head"><div><div class="kicker">RESTPROV / KOMPLETTERING</div><h2>Datum styr prioriteringen</h2><p>Gamla kapitel finns kvar för återtagning. Exakta restprovsdatum saknas i skolplanen och läggs in här när ni får dem.</p></div><button class="btn btn-primary" id="addRest">+ Lägg till</button></div><div class="grid">${rests.map(renderRestCard).join('')}</div></section>`}
function renderRestCard(r){const d=r.date?daysUntil(r.date):null;const isCustom=pstate().createdRestExams.some(x=>x.id===r.id);return `<div class="card rest-card"><div><div class="kicker">${r.date?(d<0?'PASSERAT':d===0?'IDAG':d+' DAGAR KVAR'):'DATUM SAKNAS'}</div><h3>${esc(r.title)}</h3><p>${r.date?'Planerat '+fmtDate(r.date):'Originalprov vecka '+(r.originalWeek||'—')+'. Lägg in nytt datum när skolan bekräftar.'}</p><div style="margin-top:10px"><span class="pill neutral">${r.skillIds.length} färdigheter</span></div></div><div><input class="date-input rest-date" data-rest-id="${r.id}" type="date" value="${r.date||''}" aria-label="Restprovsdatum"/><div class="section-actions" style="margin-top:10px;justify-content:flex-end"><button class="btn btn-primary" data-start-rest="${r.id}">Träna</button>${isCustom?`<button class="btn btn-danger" data-delete-rest="${r.id}">Ta bort</button>`:''}</div></div></div>`}

function renderProgress(){return `<section class="section" style="margin-top:0"><div class="section-head"><div><div class="kicker">MIN MATTEKARTA</div><h2>${profile().name} · ${overallProgress()}%</h2><p>”Sitter” kräver minst tre rätt utan hint och träff på minst två olika dagar.</p></div></div><div class="grid">${profile().chapters.map(ch=>`<div class="card chapter"><div class="chapter-head"><div><h3>${esc(ch.name)}</h3><p>${chapterProgress(ch)}% sammanvägd progression</p></div><button class="btn btn-soft" data-start-chapter="${ch.id}" data-mode="practice">Träna svagaste</button></div><div class="chapter-body">${ch.skills.map(id=>skillRow(skillById(id))).join('')}</div></div>`).join('')}</div>
 <div class="card" style="margin-top:18px"><div class="kicker">STATUSFÖRKLARING</div><div class="grid grid-4" style="margin-top:8px"><div><span class="status-dot s1"></span><b>Kan inte ännu</b><p>Försök finns men inget rätt ännu.</p></div><div><span class="status-dot s2"></span><b>Kan med stöd</b><p>Rätt med hint eller enstaka rätt.</p></div><div><span class="status-dot s3"></span><b>Kan själv</b><p>Minst två rätt utan hint.</p></div><div><span class="status-dot s4"></span><b>Sitter</b><p>Minst tre rätt utan hint över två dagar.</p></div></div></div></section>`}

function renderSettings(){return `<section class="section" style="margin-top:0"><div class="section-head"><div><div class="kicker">INSTÄLLNINGAR</div><h2>App, data och backup</h2></div></div><div class="grid grid-2"><div class="card privacy"><h3>Privat på enheten</h3><p>Resultat, fellogg och progression sparas lokalt i webbläsaren. Ingen elevdata skickas till Supabase, Lovable, Replit eller något AI-API.</p><div class="section-actions" style="margin-top:14px"><button class="btn btn-primary" id="exportBackup">Exportera backup</button><label class="btn btn-secondary" for="importBackup">Importera backup</label><input id="importBackup" type="file" accept="application/json" hidden/></div></div><div class="card"><h3>Installera som app</h3><p>PWA-versionen kan läggas på hemskärmen när den körs via HTTPS eller localhost. På iPhone: Dela → Lägg till på hemskärmen.</p><button class="btn btn-primary" id="installApp" style="margin-top:14px">Installera / visa instruktion</button></div><div class="card"><h3>Läsbarhet</h3><div style="display:grid;gap:12px;margin-top:14px"><label><input type="checkbox" id="largeText" ${state.settings.largeText?'checked':''}/> Större text</label><label><input type="checkbox" id="reduceMotion" ${state.settings.reduceMotion?'checked':''}/> Minska animationer</label></div></div><div class="card"><h3>Källgrund</h3><p>Innehållet i tidslinjen följer respektive HT-26-planering i Drive. Matematikövningarna är byggda för momenten i planeringen och kontrolleras lokalt.</p><div class="source-note" style="margin-top:12px">${DATA.meta.sourceNotes.map(esc).join('<br>')}</div></div></div>
 <div class="card danger-zone" style="margin-top:18px"><h3>Återställ ${profile().name}s progression</h3><p>Tar bort lokala försök och egna restprov för aktuell profil. Kan inte ångras utan backup.</p><button class="btn btn-danger" id="resetProfile" style="margin-top:12px">Återställ profilen</button></div></section>`}

function methodOptions(s){const ch=skillChapter(s.id);const pool=(ch?.skills||[]).filter(id=>id!==s.id).map(skillById);const seed=[...s.id].reduce((a,c)=>a+c.charCodeAt(0),0);const wrong=[];for(let i=0;i<pool.length&&wrong.length<2;i++){const x=pool[(seed+i*3)%pool.length];if(x&&!wrong.some(w=>w.id===x.id))wrong.push(x)}return [s,...wrong].sort((a,b)=>((a.id.length+seed)%7)-((b.id.length+seed)%7))}
function renderSession(){if(!session)return renderPracticeHub();if(session.done)return renderResults();const item=session.items[session.index];const s=skillById(item.skillId),e=item.exercise,p=pedagogy(s);const pct=Math.round((session.index/session.items.length)*100);const phase=session.mode==='test'?2:(session.phase??0);return `<div class="practice-shell focus-practice"><div class="practice-top"><button class="btn btn-secondary" id="exitSession">← Avsluta</button><div class="session-meter"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><small>${session.index+1}/${session.items.length}</small></div><span class="focus-xp">${pstate().xp||0} ✦</span></div><div class="phase-strip">${['ORIENTERA','VÄLJ VÄG','LÖS','FÖRSTÅ'].map((x,i)=>`<span class="${i===phase?'active':''} ${i<phase?'done':''}">${i<phase?'✓':i+1} ${x}</span>`).join('')}</div><div class="question-card calm-card"><div class="question-layout"><div class="exercise-visual large">${renderExerciseVisual(s,e)}</div><div class="question-main"><div class="kicker">${session.mode==='test'?'PROVLÄGE · INGEN METOD LEDTRÅD':esc(s.chapter)+' · '+esc(s.title)}</div><h2>${esc(e.prompt)}</h2>${phase===0?renderOrientPhase(s,e,p):phase===1?renderChoosePhase(s,e,p):phase===2?renderSolvePhase(s,e,p):renderFeedbackPhase(s,e,p)}</div></div></div></div>`}
function renderOrientPhase(s,e,p){return `<div class="phase-panel"><p class="phase-lead">Titta på bilden och läs frågan en gång. Räkna inte ännu.</p><div class="orient-cards"><div><small>DET HÄR VET DU</small><b>${esc(extractKnown(e.prompt))}</b></div><div><small>DET HÄR SKA DU HITTA</small><b>${esc(extractUnknown(e.prompt))}</b></div></div><div class="micro-coach"><b>Din första uppgift är bara att förstå situationen.</b> När du kan säga vad som är känt och okänt är du redo.</div><div class="practice-actions"><span></span><button class="btn btn-primary" data-session-phase="1">Jag ser det →</button></div></div>`}
function renderChoosePhase(s,e,p){const opts=methodOptions(s);return `<div class="phase-panel"><p class="phase-lead">Vilken metod kopplar ihop det du vet med det du söker?</p><div class="method-options">${opts.map(o=>`<button class="method-option ${session.methodChoice===o.id?(o.id===s.id?'correct':'wrong'):''}" data-method-choice="${o.id}"><span>${visualGlyph(o.visual)}</span><div><b>${esc(o.title)}</b><small>${esc(o.subtitle)}</small></div></button>`).join('')}</div>${session.methodFeedback?`<div class="feedback ${session.methodChoice===s.id?'good':'neutral'}"><strong>${session.methodChoice===s.id?'Ja – rätt väg.':'Titta igen.'}</strong>${esc(session.methodFeedback)}</div>`:''}<div class="practice-actions"><button class="btn btn-secondary" data-session-phase="0">← Tillbaka</button><button class="btn btn-primary" data-session-phase="2" ${session.methodChoice!==s.id?'disabled':''}>Nu räknar jag →</button></div></div>`}
function renderSolvePhase(s,e,p){return `<div class="phase-panel"><div class="solve-reminder"><span>1</span><p><b>Skriv sambandet först.</b> ${esc(s.rule)}</p></div>${renderAnswerControl(e)}<div id="hintArea">${session.currentHints?.map((h,i)=>`<div class="hint-box"><b>Ledtråd ${i+1}</b><br>${esc(h)}</div>`).join('')||''}</div><div class="practice-actions"><div class="left">${session.mode!=='test'?`<button class="btn btn-soft" id="hintBtn">💡 En ledtråd i taget (${(session.currentHints||[]).length}/${e.hints.length})</button>`:''}<button class="btn btn-secondary" id="keypadToggle">⌨ Matteknappar</button></div><div class="right"><button class="btn btn-primary" id="checkAnswer">${session.mode==='test'?'Spara svar':'Kontrollera mitt steg'}</button></div></div><div id="keypad" class="keypad" hidden>${['7','8','9','+','−','4','5','6','×','÷','1','2','3','(',')','0',',','x','²','√','π','⌫'].map(k=>`<button type="button" data-key="${k}">${k}</button>`).join('')}</div></div>`}
function renderFeedbackPhase(s,e,p){const f=session.feedback||{correct:false,title:'',text:''};return `<div class="phase-panel"><div id="feedbackArea">${feedbackHtml(f)}</div><div class="feedback-why"><small>VAD SKA JAG TA MED MIG?</small><p>${esc(f.correct?p.memory:smartFeedback(s,e,session.lastAnswer||'',session.wrongCount))}</p></div>${!f.correct?`<div class="mistake-mini"><b>Kontrollfrågor</b>${p.think.slice(0,3).map(x=>`<span>• ${esc(x)}</span>`).join('')}</div>`:''}<div class="practice-actions"><div class="left">${!f.correct&&session.mode!=='test'?`<button class="btn btn-secondary" data-try-again>Försök igen</button>`:''}</div><div class="right">${f.correct||f.canSkip?`<button class="btn btn-primary" id="nextQuestion">Nästa uppgift →</button>`:''}</div></div></div>`}

function renderAnswerControl(e){if(e.inputType==='choice')return `<div class="choices">${e.options.map(o=>`<button class="choice" data-choice="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;const ph=e.inputType==='scientific'?'t.ex. 4,5×10^5':'Skriv ditt svar';return `<div class="answer-line"><input id="answerInput" class="answer-input" inputmode="decimal" autocomplete="off" placeholder="${ph}" value="${esc(session.currentAnswer||'')}"/>${e.unit?`<div class="unit-tag">${esc(e.unit)}</div>`:''}</div>`}
