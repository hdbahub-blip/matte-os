// ---------- Exercise selection and session ----------
function startSkill(id){const s=skillById(id);startSession(s.exercises.map(e=>({skillId:id,exercise:e})),'practice')}
function startGuided(id){const s=skillById(id);startSession([{skillId:id,exercise:s.exercises[0]}],'practice')}
function startChapter(id,mode='practice'){const ch=chapterById(id);let items=[];let ids=mode==='practice'?weakSkills(ch.skills):[...ch.skills];ids.forEach(sid=>{const s=skillById(sid);const pool=[...s.exercises];if(mode==='test')items.push({skillId:sid,exercise:pool[Math.floor(Math.random()*pool.length)]});else items.push(...pool.slice(0,2).map(e=>({skillId:sid,exercise:e}))) });if(mode==='practice')items=items.slice(0,10);items=shuffle(items);startSession(items,mode)}
function startAuto(mode){const cur=profile().chapters.find(c=>c.status==='current')||profile().chapters[0];if(mode==='test')return startChapter(cur.id,'test');const ids=weakSkills(cur.skills).slice(0,5);let items=[];ids.forEach(id=>{const s=skillById(id);items.push({skillId:id,exercise:s.exercises[0]});if(s.exercises[1])items.push({skillId:id,exercise:s.exercises[1]})});startSession(items.slice(0,8),'practice')}
function startRest(id){const r=allRestExams().find(x=>x.id===id);if(!r)return;let items=[];weakSkills(r.skillIds).forEach(sid=>{const s=skillById(sid);items.push({skillId:sid,exercise:s.exercises[Math.floor(Math.random()*s.exercises.length)]})});startSession(items.slice(0,10),'practice')}
function startSession(items,mode){session={items,index:0,mode,results:[],feedback:null,currentAnswer:'',currentChoice:null,currentHints:[],wrongCount:0,done:false,phase:mode==='test'?2:0,methodChoice:null,methodFeedback:'',lastAnswer:''};route={view:'session'};render()}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

// ---------- Safe math parser ----------
function normalizeMath(str){return String(str||'').trim().toLowerCase().replace(/,/g,'.').replace(/[−–—]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3').replace(/π/g,'pi').replace(/\s+/g,'')}
function tokenize(str){str=normalizeMath(str).replace(/(\d|x|\))(?=(x|\(|sqrt|pi))/g,'$1*').replace(/(x|\))(?=\d)/g,'$1*');const out=[];let i=0;while(i<str.length){const c=str[i];if(/[0-9.]/.test(c)){let j=i+1;while(j<str.length&&/[0-9.]/.test(str[j]))j++;out.push({t:'num',v:Number(str.slice(i,j))});i=j;continue}if(str.startsWith('sqrt',i)){out.push({t:'sqrt'});i+=4;continue}if(str.startsWith('pi',i)){out.push({t:'num',v:Math.PI});i+=2;continue}if(c==='x'){out.push({t:'x'});i++;continue}if('+-*/^()'.includes(c)){out.push({t:c});i++;continue}throw new Error('Ogiltigt tecken')}return out}
function poly(str){const t=tokenize(str);let i=0;const trim=a=>{while(a.length>1&&Math.abs(a.at(-1))<1e-12)a.pop();return a};const add=(a,b,k=1)=>{const n=Math.max(a.length,b.length),r=Array(n).fill(0);for(let j=0;j<n;j++)r[j]=(a[j]||0)+k*(b[j]||0);return trim(r)};const mul=(a,b)=>{const r=Array(a.length+b.length-1).fill(0);for(let x=0;x<a.length;x++)for(let y=0;y<b.length;y++)r[x+y]+=a[x]*b[y];return trim(r)};const scale=(a,k)=>a.map(v=>v*k);const power=(a,n)=>{if(!Number.isInteger(n)||n<0||n>6)throw Error('potens');let r=[1];for(let k=0;k<n;k++)r=mul(r,a);return r};
 function primary(){const q=t[i];if(!q)throw Error('slut');if(q.t==='num'){i++;return[q.v]}if(q.t==='x'){i++;return[0,1]}if(q.t==='('){i++;const r=expr();if(t[i]?.t!==')')throw Error(')');i++;return r}if(q.t==='sqrt'){i++;if(t[i]?.t!=='(')throw Error('sqrt(');i++;const r=expr();if(t[i]?.t!==')')throw Error(')');i++;if(r.slice(1).some(v=>Math.abs(v)>1e-12)||r[0]<0)throw Error('sqrt');return[Math.sqrt(r[0])]}throw Error('prim')}
 function unary(){if(t[i]?.t==='+'){i++;return unary()}if(t[i]?.t==='-'){i++;return scale(unary(),-1)}return primary()}
 function pow(){let r=unary();while(t[i]?.t==='^'){i++;const e=unary();if(e.length>1)throw Error('exp');r=power(r,e[0])}return r}
 function term(){let r=pow();while(t[i]&&['*','/'].includes(t[i].t)){const op=t[i++].t,q=pow();if(op==='*')r=mul(r,q);else{if(q.length>1||Math.abs(q[0])<1e-12)throw Error('div');r=scale(r,1/q[0])}}return r}
 function expr(){let r=term();while(t[i]&&['+','-'].includes(t[i].t)){const op=t[i++].t;r=add(r,term(),op==='+'?1:-1)}return r}
 const r=expr();if(i!==t.length)throw Error('rest');return trim(r)}
function numericValue(str){const p=poly(str);if(p.length>1&&p.slice(1).some(v=>Math.abs(v)>1e-10))throw Error('x');return p[0]}
function equivalent(a,b,tol=1e-8){try{const A=poly(a),B=poly(b),n=Math.max(A.length,B.length);for(let i=0;i<n;i++)if(Math.abs((A[i]||0)-(B[i]||0))>tol)return false;return true}catch{return normalizeMath(a)===normalizeMath(b)}}
function parseScientific(str){const s=normalizeMath(str);let m=s.match(/^([+-]?\d+(?:\.\d+)?)(?:\*?10\^([+-]?\d+))$/);if(!m)m=s.match(/^([+-]?\d+(?:\.\d+)?)e([+-]?\d+)$/);return m?[Number(m[1]),Number(m[2])]:null}
function gradeExercise(e,answer){
 try{if(e.inputType==='choice')return String(answer)===String(e.answer);
 if(e.inputType==='expression')return equivalent(answer,e.answer);
 if(e.inputType==='scientific'){const p=parseScientific(answer);return !!p&&Math.abs(p[0]-e.answer[0])<1e-9&&p[1]===e.answer[1]&&Math.abs(p[0])>=1&&Math.abs(p[0])<10}
 const v=numericValue(answer),tol=e.tolerance??1e-6;return Math.abs(v-Number(e.answer))<=tol}catch{return false}}
function displayAnswer(e){if(e.inputType==='scientific')return `${String(e.answer[0]).replace('.',',')} × 10^${e.answer[1]}`;return String(e.answer)+(e.unit?' '+e.unit:'')}

function smartFeedback(s,e,answer,wrongCount=1){let v=null;try{v=numericValue(answer)}catch{}const a=Number(e.answer);if(s.id==='s9-pythagoras'&&Number.isFinite(v)){if(Math.abs(v-a*a)<.1)return 'Du har sannolikt hittat den okända sidan i kvadrat. Sista steget är att ta kvadratroten.';if(v>0&&v<a&&String(e.prompt).toLowerCase().includes('hypoten'))return 'Hypotenusan ska vara längst. Kontrollera att c ligger mitt emot 90° och att du adderar kateternas kvadrater.'}
 if(s.id==='s9-area-scale'&&Number.isFinite(v))return 'Area har två dimensioner. Kontrollera att längdfaktorn har kvadrerats – och ta roten om du går bakåt från area till längd.';
 if(s.id==='s9-volume-scale'&&Number.isFinite(v))return 'Volym har tre dimensioner. Kontrollera om du behöver k³ eller kubikroten när du går bakåt.';
 if(s.id==='f8-circle-area')return 'Kontrollera först om talet i uppgiften är radie eller diameter. För area använder du πr²; går du bakåt från area delar du med π och tar roten.';
 if(s.id==='f8-circle-circ')return 'Omkrets är kanten runt cirkeln: 2πr eller πd. πr² hör till area.';
 if(s.id==='f8-units')return 'Börja med dimensionen: längd → 10 per steg, area → 100, volym → 1000. Det avgör faktorn.';
 if(s.id==='f8-equations'||s.id==='f8-x-both-sides')return 'Tänk balans i stället för “flytta”. Vilken motsatt operation kan du göra på båda sidor för att få x mer ensamt?';
 if(s.id.startsWith('f8-fractions'))return 'Rita bråket som lika stora delar. Vid plus/minus måste delarna vara lika stora; vid division vänder du bara det andra bråket.';
 if(s.id.startsWith('s9-percent'))return 'Namnge först DEL, HELA och PROCENT. Det som saknas avgör om du ska dividera eller multiplicera.';
 return (pedagogy(s).mistakes||[])[Math.min(wrongCount-1,(pedagogy(s).mistakes||[]).length-1)]||e.wrong||'Jämför det du söker med sambandet och kontrollera enhet och rimlighet.'}

async function recordAttempt(skillId,ex,correct,hintsUsed,mode){const earned=correct?(mode==='test'?15:Math.max(5,12-(hintsUsed||0)*2)):0;pstate().attempts.push({skillId,exId:ex.id,correct,hintsUsed,mode,xp:earned,ts:new Date().toISOString()});pstate().xp=(pstate().xp||0)+earned;if(pstate().attempts.length>1500)pstate().attempts=pstate().attempts.slice(-1200);await saveState();return earned}

function bindSession(){const item=session.items[session.index],e=item.exercise,s=skillById(item.skillId);let input=$('#answerInput');if(input)input.focus();document.querySelectorAll('[data-session-phase]').forEach(b=>b.addEventListener('click',()=>{session.phase=Number(b.dataset.sessionPhase);render()}));document.querySelectorAll('[data-method-choice]').forEach(b=>b.addEventListener('click',()=>{session.methodChoice=b.dataset.methodChoice;session.methodFeedback=session.methodChoice===s.id?`Rätt. ${pedagogy(s).recognize[0]||s.when}`:`Inte riktigt. Leta efter: ${pedagogy(s).recognize[0]||s.when}`;render()}));document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');session.currentChoice=b.dataset.choice}));$('#keypadToggle')?.addEventListener('click',()=>{$('#keypad').hidden=!$('#keypad').hidden});document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{if(!input)return;const k=b.dataset.key;if(k==='⌫')input.value=input.value.slice(0,-1);else{const ins=k==='−'?'-':k==='×'?'×':k==='÷'?'÷':k;input.value+=ins}session.currentAnswer=input.value;input.focus()}));input?.addEventListener('input',()=>session.currentAnswer=input.value);
 $('#hintBtn')?.addEventListener('click',()=>{if(session.currentHints.length<e.hints.length){session.currentHints.push(e.hints[session.currentHints.length]);render()}});
 $('#checkAnswer')?.addEventListener('click',async()=>{const ans=e.inputType==='choice'?session.currentChoice:(input?.value||session.currentAnswer||'');if(ans===null||String(ans).trim()===''){toast('Skriv eller välj ett svar först.');return}session.lastAnswer=String(ans);const ok=gradeExercise(e,ans),hints=session.currentHints.length;if(session.mode==='test'){const earned=await recordAttempt(item.skillId,e,ok,0,'test');session.results.push({skillId:item.skillId,exId:e.id,correct:ok,hintsUsed:0,xp:earned});session.index++;resetCurrent();if(session.index>=session.items.length)session.done=true;render();return}const earned=await recordAttempt(item.skillId,e,ok,hints,'practice');if(ok){session.feedback={correct:true,title:`Rätt väg + rätt svar · +${earned} ✦`,text:e.correct};session.results.push({skillId:item.skillId,exId:e.id,correct:true,hintsUsed:hints,xp:earned})}else{session.wrongCount++;const reveal=session.wrongCount>=3?` Efter tre försök: rätt svar är ${displayAnswer(e)}. Titta på vägen – inte bara svaret.`:'';session.feedback={correct:false,title:'Bra – nu hittade vi exakt vad som behöver justeras',text:smartFeedback(s,e,ans,session.wrongCount)+reveal};if(session.wrongCount>=3){session.results.push({skillId:item.skillId,exId:e.id,correct:false,hintsUsed:hints,xp:0});session.feedback.canSkip=true}}session.phase=3;render()});
 $('#nextQuestion')?.addEventListener('click',()=>{session.index++;resetCurrent();if(session.index>=session.items.length)session.done=true;render()});$('[data-try-again]')?.addEventListener('click',()=>{session.feedback=null;session.phase=2;render()});$('#exitSession')?.addEventListener('click',()=>{if(confirm('Avsluta passet? Sparade försök ligger kvar.')){session=null;route={view:'home'};render()}})
}

function resetCurrent(){session.feedback=null;session.currentAnswer='';session.currentChoice=null;session.currentHints=[];session.wrongCount=0;session.phase=session.mode==='test'?2:0;session.methodChoice=null;session.methodFeedback='';session.lastAnswer=''}

function bindCommon(){
 document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>{session=null;route={view:el.dataset.nav};render()}));
 document.querySelectorAll('[data-skill]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('button'))return;route={view:'skill',skillId:el.dataset.skill,stage:0,reveal:1};render()}));
 document.querySelectorAll('[data-chapter]').forEach(el=>el.addEventListener('click',()=>{const ch=el.dataset.chapter;route={view:'library'};render();setTimeout(()=>document.querySelector(`[data-start-chapter="${ch}"]`)?.scrollIntoView({behavior:'smooth'}),0)}));
 document.querySelectorAll('[data-start-skill]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();startSkill(el.dataset.startSkill)}));
 document.querySelectorAll('[data-start-chapter]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();startChapter(el.dataset.startChapter,el.dataset.mode||'practice')}));
 document.querySelectorAll('[data-start-auto]').forEach(el=>el.addEventListener('click',()=>startAuto(el.dataset.startAuto)));
 document.querySelectorAll('[data-start-rest]').forEach(el=>el.addEventListener('click',()=>startRest(el.dataset.startRest)));
 document.querySelectorAll('[data-lesson-stage]').forEach(el=>el.addEventListener('click',()=>{route.stage=Number(el.dataset.lessonStage);if(route.stage!==3)route.reveal=1;render()}));
 $('[data-lesson-prev]')?.addEventListener('click',()=>{route.stage=Math.max(0,(route.stage||0)-1);route.reveal=1;render()});
 $('[data-lesson-next]')?.addEventListener('click',()=>{route.stage=Math.min(5,(route.stage||0)+1);route.reveal=1;render()});
 $('[data-reveal-next]')?.addEventListener('click',()=>{route.reveal=(route.reveal||1)+1;render()});
 $('[data-reset-reveal]')?.addEventListener('click',()=>{route.reveal=1;render()});
 document.querySelectorAll('[data-start-guided]').forEach(el=>el.addEventListener('click',()=>startGuided(el.dataset.startGuided)));
 $('#profileSwitch')?.addEventListener('click',showProfileModal);
 $('#globalSearch')?.addEventListener('input',onSearch);$('#globalSearch')?.addEventListener('focus',onSearch);
 document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap')){$('#searchResults')?.replaceChildren()}} ,{once:true});
 document.querySelectorAll('.rest-date').forEach(el=>el.addEventListener('change',async()=>{const r=allRestExams().find(x=>x.id===el.dataset.restId);if(r){r.date=el.value||null;await saveState();toast('Restprovsdatum sparat');render()}}));
 document.querySelectorAll('[data-delete-rest]').forEach(el=>el.addEventListener('click',async()=>{if(confirm('Ta bort detta egna restprov?')){pstate().createdRestExams=pstate().createdRestExams.filter(x=>x.id!==el.dataset.deleteRest);await saveState();render()}}));
 $('#addRest')?.addEventListener('click',showAddRestModal);
 $('#exportBackup')?.addEventListener('click',exportBackup);$('#importBackup')?.addEventListener('change',importBackup);
 $('#largeText')?.addEventListener('change',async e=>{state.settings.largeText=e.target.checked;await saveState();setTheme()});$('#reduceMotion')?.addEventListener('change',async e=>{state.settings.reduceMotion=e.target.checked;await saveState();setTheme()});
 $('#resetProfile')?.addEventListener('click',async()=>{if(confirm(`Återställa all lokal progression för ${profile().name}? Exportera backup först om du vill kunna ångra.`)){const base=DATA.profiles[state.activeProfile];state.profiles[state.activeProfile]={attempts:[],restExams:clone(base.restExams),createdRestExams:[]};await saveState();toast('Profil återställd');render()}});
 $('#installApp')?.addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else alert('På iPhone/iPad: öppna i Safari → Dela → Lägg till på hemskärmen. På dator/Android visas normalt en installationsikon i adressfältet när sidan körs via HTTPS.')});
}

function onSearch(e){const q=e.target.value.trim().toLowerCase();const box=$('#searchResults');if(!q){box.innerHTML='';return}const ids=new Set(profile().chapters.flatMap(c=>c.skills));const terms=q.split(/\s+/);const res=DATA.skills.filter(s=>ids.has(s.id)).map(s=>{const hay=[s.title,s.subtitle,s.when,s.rule,...s.keywords].join(' ').toLowerCase();const score=terms.reduce((n,t)=>n+(hay.includes(t)?1:0),0)+(s.title.toLowerCase().includes(q)?3:0);return{s,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8);box.innerHTML=res.length?`<div class="search-results">${res.map(({s})=>`<div class="search-result" data-search-skill="${s.id}"><div><strong>${esc(s.title)}</strong><small>${esc(s.chapter)} · ${esc(s.when)}</small></div><span>→</span></div>`).join('')}</div>`:`<div class="search-results"><div class="empty"><b>Ingen direkt träff</b>Prova ett enklare ord, t.ex. “cirkel”, “bråk” eller “skala”.</div></div>`;document.querySelectorAll('[data-search-skill]').forEach(x=>x.addEventListener('click',()=>{route={view:'skill',skillId:x.dataset.searchSkill};render()}))}

function showProfileModal(){showModal(`<button class="modal-close" data-close>×</button><div class="kicker">BYT PROFIL</div><h2>Vem pluggar?</h2><div class="grid grid-2">${Object.entries(DATA.profiles).map(([id,p])=>`<button class="card clickable" data-pick-profile="${id}" style="text-align:left;border-color:${id===state.activeProfile?'var(--accent)':'var(--line)'}"><div class="avatar" style="background:${p.accent};margin-bottom:14px">${p.name[0]}</div><h3>${p.name}</h3><p>Årskurs ${p.grade}</p></button>`).join('')}</div>`);document.querySelectorAll('[data-pick-profile]').forEach(x=>x.addEventListener('click',async()=>{state.activeProfile=x.dataset.pickProfile;await saveState();closeModal();route={view:'home'};render()}))}
function showAddRestModal(){showModal(`<button class="modal-close" data-close>×</button><div class="kicker">NYTT RESTPROV</div><h2>Lägg in det skolan har sagt</h2><div class="form-grid"><div class="field full"><label>Namn</label><input id="restTitle" placeholder="t.ex. Restprov Geometri"/></div><div class="field"><label>Datum</label><input id="restDate" type="date"/></div><div class="field"><label>Kapitel</label><select id="restChapter">${profile().chapters.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><button class="btn btn-primary btn-wide" id="saveRest">Spara restprov</button></div></div>`);$('#saveRest').addEventListener('click',async()=>{const title=$('#restTitle').value.trim();if(!title){toast('Skriv ett namn');return}const ch=chapterById($('#restChapter').value);pstate().createdRestExams.push({id:'custom-'+Date.now(),title,date:$('#restDate').value||null,originalWeek:null,skillIds:[...ch.skills]});await saveState();closeModal();render();toast('Restprov tillagt')})}
function showModal(html){const d=document.createElement('div');d.className='modal-backdrop';d.id='modalLayer';d.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-close]'))closeModal()})}
function closeModal(){$('#modalLayer')?.remove()}

function exportBackup(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),appVersion:APP_VERSION,state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`matte-os-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Backup exporterad')}
async function importBackup(e){const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj.state?.profiles)throw Error('format');if(!confirm('Importera backup och ersätta nuvarande lokala data?'))return;state=obj.state;await saveState();toast('Backup importerad');render()}catch{alert('Filen kunde inte läsas som en Matte OS-backup.')}}

window.__MATTE_OS_TEST__={gradeExercise,poly,numericValue,parseScientific,equivalent,DATA,PED,smartFeedback,renderExerciseVisual};

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
window.addEventListener('appinstalled',()=>toast('Matte OS installerad'));

async function init(){state=await loadState();if(!state?.profiles?.grade9||!state?.profiles?.grade8)state=defaultState();ensureStateShape();setTheme();render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn)}
init();
